[project]
name = "vault-wordcloud"
version = "0.1.0"
description = "Word cloud of the Home, Exocortex, About me and Articles notes of the burny-website Obsidian vault"
authors = [
    { name = "BurnyCoder", email = "happymancz@email.cz" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "stopwordsiso>=0.7.1",
    "wordcloud>=1.9.6",
]

[project.scripts]
vault-wordcloud = "vault_wordcloud.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
